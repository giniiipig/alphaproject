<!doctype html>
<html lang="ko" class="h-full bg-neutral-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>여떠잼</title>

    <!-- (선택) 운영 배포에서 API 도메인이 따로 있으면 주입 -->
    <!-- <meta name="api-base" content="https://api.example.com" /> -->

    <!-- 폰트/스타일 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <style>
      body { font-family: 'Inter', sans-serif !important; }
      ::-webkit-scrollbar { display: none; }
      html, body { -ms-overflow-style: none; scrollbar-width: none; max-width: 100%; }
      html, body, #root { background-color: #f5f5f5 !important; min-height: 100%; }
    </style>

    <!-- ✅ 전역 설정만 유지 (/api 프록시 등) -->
    <script type="module">
      const normalize = (value, fallback) => {
        if (value === undefined || value === null) return fallback;
        const str = String(value).trim();
        if (!str) return fallback;
        if (str === "/") return "/";
        return str.replace(/\/+$/, "") || fallback;
      };

      const metaApi = document.querySelector('meta[name="api-base"]')?.content;
      const metaAi = document.querySelector('meta[name="ai-base"]')?.content;
      const env = import.meta.env || {};
      const envApi = env.VITE_API_BASE || env.VITE_API_BASE_URL || env.VITE_BACKEND_ORIGIN;
      const envAi = env.VITE_AI_URL;

      window.__API_BASE = normalize(metaApi || envApi || window.__API_BASE, "/api");
      window.__AI_BASE = normalize(metaAi || envAi || window.__AI_BASE, "/ai");
      // 카카오 SDK/초기화 불필요: 로그인 시작은 백엔드 /auth/kakao/login/로 이동
    </script>
  </head>

  <body class="min-h-screen bg-neutral-50">
    <div id="root" class="min-h-screen bg-neutral-50"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
